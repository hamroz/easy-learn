# Local production-like stack: `docker compose up -d --build --wait`, then open http://localhost:3000
# Settings come from .env (copy .env.docker.example). Sign the CLIs in once:
#   docker compose exec -it web codex login --device-auth
#   docker compose exec -it web claude        (then type /login)
name: easy-learn

services:
  web:
    image: ${EASY_LEARN_IMAGE:-easy-learn:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://easylearn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/easylearn
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      AI_PROVIDER: ${AI_PROVIDER:-codex-cli}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${EASY_LEARN_PORT:-3000}:3000"
    volumes:
      - home:/data/home
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/.next/cache:size=64m,uid=10010,gid=10010
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    networks: [default, backend]
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easylearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: easylearn
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U easylearn -d easylearn"]
      interval: 5s
      timeout: 5s
      retries: 12
    cpus: 1.0
    mem_limit: 512m
    networks: [backend]
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }

networks:
  backend:
    internal: true

volumes:
  home:
  pg:
